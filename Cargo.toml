[package]
name = "my_open_scanner"
version = "0.1.0"
edition = "2021"

[dependencies]
image = "0.25"
imageproc = "0.25"
nalgebra = { version = "0.33", features = ["serde-serialize"] }
palette = "0.7"
pdf-writer = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
anyhow = "1.0"
thiserror = "2.0"

[features]
default = []
imageproc-warp = []
